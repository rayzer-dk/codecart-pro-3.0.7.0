name: CodeCart PRO 3.0.7.0 Full Installable Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codecart-3070-full-archive.yml'
      - '.github/workflows/playwright-e2e.yml'
      - '.github/workflows/source-quality-deep.yml'
      - 'tools/package_production.py'
      - 'tools/refresh_integrity.php'
      - 'tools/package_documentation.py'
      - 'tools/vendor_workbox.mjs'
      - 'upload/**'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codecart-pro-3070-full-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build, verify and upload full installable ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
      - name: Allocate next monotonically increasing release build
        shell: bash
        run: |
          set -euo pipefail
          last="$(git ls-remote --tags origin 'refs/tags/v3.0.7.0-build.0.0.*' |
            sed -nE 's@.*refs/tags/v3\.0\.7\.0-build\.0\.0\.([0-9]+)$@\1@p' | sort -n | tail -1)"
          next=$(( ${last:-0} + 1 ))
          echo "CODECART_RELEASE_BUILD=0.0.$next" >> "$GITHUB_ENV"
          echo "Building CodeCart PRO 3.0.7.0, release build 0.0.$next"
      - name: Install PHP 8.4 and locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:2.11.2
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and install Composer runtime dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs
      - name: Rebuild pinned Font Awesome Free 7.3.1 Core
        run: |
          python -m pip install 'fonttools[woff]>=4.55,<5' brotli
          python tools/build_fontawesome_core.py
      - name: Rebuild minified storefront and admin assets
        run: bash tools/build_theme_css.sh
      - name: Generate versioned documentation and verified Workbox 7.4.1 assets
        run: |
          python tools/package_documentation.py
          node tools/vendor_workbox.mjs
      - name: Refresh integrity and run release validation
        run: |
          php tools/refresh_integrity.php
          php tools/release_check.php
      - name: Build full installable CodeCart PRO ZIP with Composer vendor
        run: |
          mkdir -p artifacts
          python tools/package_production.py --output artifacts
      - name: Verify ZIP manifest and SHA-256 against the actual archive
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          files=list(pathlib.Path('artifacts').glob('CodeCart_PRO_3.0.7.0_Build_0.0.*_Full_Installable.zip'))
          assert len(files)==1, 'Exactly one versioned ZIP required'
          file=files[0]
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              names=set(z.namelist())
              for expected in ('upload/index.php', 'upload/admin/index.php', 'upload/install/index.php',
                               'upload/system/storage/vendor/autoload.php', 'upload/system/config/codecart_integrity.json'):
                  assert expected in names, 'Missing '+expected
              assert b"CODECART_PACKAGE_BUILD', '3.0.7.0'" in z.read('upload/index.php')
              assert b"CODECART_PACKAGE_BUILD', '3.0.7.0'" in z.read('upload/install/index.php')
          manifest=json.loads(file.with_suffix('.zip.manifest.json').read_text())
          assert manifest['release_build']==__import__('os').environ['CODECART_RELEASE_BUILD']
          assert file.name=='CodeCart_PRO_3.0.7.0_Build_'+manifest['release_build']+'_Full_Installable.zip'
          digest=hashlib.sha256(file.read_bytes()).hexdigest()
          assert manifest['archive_sha256']==digest, 'Package digest mismatch'
          assert manifest['source_commit']==__import__('subprocess').check_output(['git','rev-parse','HEAD']).decode().strip()
          print(f'PASS: {file.name}, {len(names)} entries, {file.stat().st_size:,} bytes, SHA256 {digest}')
          PY
      - name: Publish complete installable archive, checksums and file manifest
        uses: actions/upload-artifact@v4
        with:
          name: CodeCart_PRO_3.0.7.0_Full_Installable
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified v3.0.7.0-build.0.0.N tag and GitHub Release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release target for authenticated GitHub CLI
        uses: actions/checkout@v4
      - name: Verify all required QA workflows on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          workflows=(modernization-pilot-qa.yml source-quality-deep.yml playwright-e2e.yml)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$sha" ]; then
            echo "main advanced after package build; refusing stale release."
            exit 1
          fi
          for workflow in "${workflows[@]}"; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&per_page=30")"
            if ! jq -e --arg sha "$sha" '.workflow_runs | any(.head_sha==$sha)' <<< "$runs" >/dev/null; then
              gh workflow run "$workflow" --ref main
            fi
          done
          for attempt in {1..90}; do
            ok=1
            for workflow in "${workflows[@]}"; do
              data="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&per_page=30")"
              result="$(jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | last | .conclusion // "pending"' <<< "$data")"
              echo "$workflow: $result"
              case "$result" in
                success) ;;
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "Required QA failed: $workflow ($result)"
                  exit 1 ;;
                *) ok=0 ;;
              esac
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 20
          done
          echo 'Required QA did not complete successfully before the release deadline.'
          exit 1
      - name: Retrieve the exact verified installation artifact
        uses: actions/download-artifact@v4
        with:
          name: CodeCart_PRO_3.0.7.0_Full_Installable
          path: release-artifacts
      - name: Recheck ZIP and source SHA before publishing
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          root=pathlib.Path('release-artifacts')
          matches=list(root.glob('CodeCart_PRO_3.0.7.0_Build_0.0.*_Full_Installable.zip'))
          assert len(matches)==1, 'Expected exactly one release ZIP'
          package=matches[0]
          manifest=pathlib.Path(str(package)+'.manifest.json')
          assert package.is_file() and manifest.is_file(), 'Missing release artifact or manifest'
          doc=json.loads(manifest.read_text())
          assert doc['source_commit']==os.environ['GITHUB_SHA'], 'Artifact source commit differs from release commit'
          assert package.name=='CodeCart_PRO_3.0.7.0_Build_'+doc['release_build']+'_Full_Installable.zip'
          assert doc['archive_sha256']==hashlib.sha256(package.read_bytes()).hexdigest(), 'ZIP checksum mismatch'
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None, 'ZIP integrity failure'
          print('Verified release archive and source commit',doc['source_commit'])
          PY
      - name: Create immutable build tag and publish checked release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find release-artifacts -maxdepth 1 -name 'CodeCart_PRO_3.0.7.0_Build_0.0.*_Full_Installable.zip' -print -quit)"
          test -n "$zip"
          build="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["release_build"])' "$zip.manifest.json")"
          tag="v3.0.7.0-build.$build"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists; refusing overwrite."
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'main advanced; refusing to tag an outdated commit.'
            exit 1
          fi
          gh release create "$tag" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeCart PRO 3.0.7.0 — Build $build" \
            --notes "Complete installable CodeCart PRO 3.0.7.0, build $build. SHA-256 and manifest attached. Modernization QA, first-party code quality and cross-browser Playwright E2E must all pass on the tagged commit."
