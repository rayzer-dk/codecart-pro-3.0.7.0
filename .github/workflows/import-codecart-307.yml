name: Import complete CodeCart PRO 3.0.7.0 source
on:
  push:
    paths:
      - .github/workflows/import-codecart-307.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codecart307-one-time-import
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'rayzer-dk/codecart-pro-3.0.7.0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout destination main including history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch legacy repository read-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CodeCart PRO migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add legacy https://github.com/rayzer-dk/CodeCart-3-0-6.git
          git fetch --no-tags legacy \
            refs/heads/main:refs/remotes/legacy/main \
            refs/heads/feature/codecart-3.7.0-modernization:refs/remotes/legacy/modern
          echo "Legacy main: $(git rev-parse legacy/main)"
          echo "Modernization: $(git rev-parse legacy/modern)"
      - name: Assemble full source working tree with modernization
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/codecart307-source" legacy/main
          git -C "${RUNNER_TEMP}/codecart307-source" merge --no-edit -s ort -X ours legacy/modern
          # Retain the modernization Composer manifest together with its matching lock.
          git -C "${RUNNER_TEMP}/codecart307-source" checkout legacy/modern -- composer.json composer.lock
      - name: Copy full source into new repository without workflow permission conflicts
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.github/workflows/' \
            --exclude='/README.md' \
            "${RUNNER_TEMP}/codecart307-source/" "${GITHUB_WORKSPACE}/"
          test -f upload/index.php
          test -f upload/admin/index.php
          test -f upload/system/startup.php
      - name: Name release 3.0.7.0 and correct core compatibility descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for filename in ('upload/index.php','upload/admin/index.php'):
              p=Path(filename)
              s=p.read_text()
              import re
              for key,value in (
                  ('VERSION','3.0.7.0'),
                  ('CODECART_BUILD','3.0.7.0'),
                  ('CODECART_PACKAGE_BUILD','3.0.7.0'),
                  ('CODECART_BASE','CodeCart PRO 3.0.7.0')
              ):
                  pattern=r"define\('"+key+r"',\s*'[^']*'\);"
                  s,count=re.subn(pattern,"define('"+key+"', '"+value+"');",s,count=1)
                  if count != 1: raise SystemExit('Missing '+key+' in '+filename)
              p.write_text(s)
          p=Path('composer.json')
          d=json.loads(p.read_text())
          d['name']='codecart/codecart-pro-3.0.7.0'
          d['description']='CodeCart PRO 3.0.7.0 modernization based on OpenCart/ocStore 3.x'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('upload/admin/view/template/tool/codecart_core.twig')
          s=p.read_text()
          s=s.replace('CodeCart PRO 3.0.6.x','CodeCart PRO 3.0.7.0')
          p.write_text(s)
          p=Path('upload/admin/controller/tool/codecart_core.php')
          s=p.read_text()
          fixed={
            "'PHP 8.1–8.5'":"'PHP 8.2–8.5'",
            "'codecart'=>'7.15.5'":"'codecart'=>'8.5.2'",
            "'codecart'=>'3.28.0'":"'codecart'=>'3.30.0'",
            "'codecart'=>'2.5.3'":"'codecart'=>'3.1.x (composer)'",
            "'codecart'=>'2.13.1'":"'codecart'=>'3.4.x (composer)'",
            "'codecart'=>'6.4.45'":"'codecart'=>'7.4.x (composer)'",
            "'codecart'=>'3.4.1','status'=>'added'":"'codecart'=>'3.4.1 legacy / 4.0.2 preview','status'=>'added'",
            "'codecart'=>'3.7.1 Legacy Core'":"'codecart'=>'3.7.1 legacy / 4.1.0 preview'",
            "'codecart'=>'3.4.1 Legacy Core'":"'codecart'=>'3.4.1 legacy / 5.3.9 preview'",
            "'codecart'=>'6.7.2 + AUTO/Core/Full + FA4 compatibility'":"'codecart'=>'7.3.1 + AUTO/Core/Full + FA4 compatibility'",
            "'codecart'=>'5.65.21'":"'codecart'=>'5.65.21 legacy / 6 preview'",
            "'codecart'=>'2.30.1'":"'codecart'=>'2.30.1 legacy / 2.31.0 preview'"
          }
          for old,new in fixed.items():
              if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          for lang in ('uk-ua','ru-ru','en-gb'):
              p=Path('upload/admin/language')/lang/'tool/codecart_core.php'
              if p.exists():
                  s=p.read_text().replace('Font Awesome 6.7.2','Font Awesome 7.3.1')
                  p.write_text(s)
          Path('README.md').write_text(
            '# CodeCart PRO 3.0.7.0\n\n'
            'OpenCart/ocStore 3.x-based commerce system.\n\n'
            'This branch combines legacy fixes with the experimental modern stack. '
            'The release is not production-certified until the full QA and module/checkout regression passes.\n'
          )
          Path('documentation/MIGRATION_307_STATUS.md').write_text(
            '# CodeCart PRO 3.0.7.0\n\n'
            'Source: CodeCart-3-0-6 main and feature/codecart-3.7.0-modernization.\n'
            'Full source tree copied into new main from both branches. Source Git history stays in the old repo.\n'
            'Conflict strategy: preserve recent legacy main changes on overlapping hunks; modernization-only files are imported. Original workflow definitions are excluded from this token-based import and need separate GitHub connector upload.\n'
            'Release status: migration preview; real-store E2E, OCMOD and payments are not certified.\n'
          )
          PY
      - name: Validate migration contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f upload/admin/controller/tool/codecart_core.php
          test -f upload/admin/view/template/tool/codecart_core.twig
          test -f upload/catalog/view/javascript/codecart-bs5-preview/bootstrap-5.3.9.bundle.min.js
          test -f upload/admin/view/stylesheet/codecart-main-ui.css
          # Workflow definitions require a separate authorized upload.
          php -l upload/admin/controller/tool/codecart_core.php
          php -l upload/index.php
          php -l upload/admin/index.php
          git add -A
          git diff --cached --check -- upload/index.php upload/admin/index.php upload/admin/controller/tool/codecart_core.php
      - name: Commit and push imported system into new main only
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --quiet || git commit -m "chore(release): CodeCart PRO 3.0.7.0 naming and compatibility report"
          git push origin HEAD:main
